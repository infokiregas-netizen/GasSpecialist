<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Business Card - Erik Pienaar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #1a2a44; /* Gas Specialist Red */
            --dark-color: #2c3e50;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f4f4; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: white; width: 350px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); overflow: hidden; text-align: center; padding-bottom: 20px; }
        .header { background: var(--dark-color); padding: 30px 10px; }
        .logo { width: 120px; height: 120px; background: white; border-radius: 50%; border: 5px solid var(--primary-color); margin-top: -60px; display: inline-block; overflow: hidden; }
        .logo img { width: 100%; height: auto; padding: 10px; }
        h1 { margin: 10px 0 5px; font-size: 22px; color: var(--dark-color); }
        p.title { color: var(--primary-color); font-weight: bold; margin-bottom: 20px; }
        .links { padding: 0 20px; text-align: left; }
        .link-item { display: flex; align-items: center; margin-bottom: 15px; text-decoration: none; color: #555; font-size: 14px; border-bottom: 1px solid #eee; padding-bottom: 8px; }
        .link-item i { width: 30px; color: var(--primary-color); font-size: 18px; }
        .btn-save { background: var(--primary-color); color: white; padding: 12px 30px; border-radius: 25px; text-decoration: none; display: inline-block; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <div class="header"></div>
        <div class="logo">
            <img src="logo.png" alt="Company Logo">
        </div>
        
        <h1>Erik Pienaar</h1>
        <p class="title">Gas Specialist</p>

        <div class="links">
            <a href="tel:0154951528" class="link-item"><i class="fas fa-phone"></i> Office: 015 495 1528</a>
            <a href="tel:0838753383" class="link-item"><i class="fas fa-phone"></i> Cell: 0838753383</a>
            <a href="https://wa.me/27647036747" class="link-item"><i class="fab fa-whatsapp"></i> WhatsApp</a>
            <a href="mailto:info@gasspecialist.co.za" class="link-item"><i class="fas fa-envelope"></i> info@gasspecialist.co.za</a>
            <a href="https://gasspecialist.co.za" class="link-item"><i class="fas fa-globe"></i> www.gasspecialist.co.za</a>
            <div class="link-item"><i class="fas fa-map-marker-alt"></i> 14, Maroela Avenue, Polokwane</div>
        </div>

        <a href="contact.vcf" class="btn-save">Save to Contacts</a>
    </div>

</body>
</html>
